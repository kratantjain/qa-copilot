[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-copilot"
version = "0.1.0"
description = "AI copilot for QA: requirement analysis, test design, traceability and export - local or cloud LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kratant" }]
dependencies = ["requests>=2.31", "openpyxl>=3.1"]

[project.optional-dependencies]
ui = ["nicegui>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
qa-copilot = "qa_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
main_file = ""
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
per-file-ignores = { "src/qa_copilot/prompts.py" = ["E501"] }
